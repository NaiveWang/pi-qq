name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: |
          npm publish --provenance
          # The self-patch lives on main since 0.4.0 (the old
          # patched-core-0.2.x line is retired). Keep the legacy `patched`
          # dist-tag on this same build so existing `@patched` installs
          # keep receiving the fixed, pruning build.
          npm dist-tag add "@elvinw/pi-qq@$(node -p 'require("./package.json").version')" patched
