# Tag families (both start with v, so a single pattern covers both):
#   v0.2.1            → mainline build        → npm dist-tag `latest`
#   v0.2.1-patched.1  → patched-core build    → npm dist-tag `patched`
# The -patched.* tags live on the patched-core-0.2.x branch, so the
# checkout lands on that branch's code and version.
name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: |
          if [[ "$GITHUB_REF_NAME" == *"-patched."* ]]; then
            npm publish --provenance --tag patched
          else
            npm publish --provenance
          fi
