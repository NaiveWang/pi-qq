name: publish
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      # Pure OIDC (trusted publishing) authenticates ONLY `npm publish`.
      # `npm dist-tag add` needs a token, so the legacy `patched` tag is
      # intentionally not maintained — the self-patch is mainline since
      # 0.4.0, so `patched` is redundant with `latest`.
      - run: npm publish --provenance
